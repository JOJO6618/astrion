<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>资源繁忙</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Helvetica Neue", sans-serif;
            background: #f7f7f7;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #333;
        }
        .card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            padding: 48px 56px;
            max-width: 460px;
            text-align: center;
        }
        h1 {
            font-size: 24px;
            margin: 0 0 16px;
            color: #e63946;
        }
        p {
            margin: 0 0 20px;
            line-height: 1.6;
        }
        .hint {
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>资源繁忙，请稍后重试</h1>
        <p>当前在线用户已达上限，为保证服务器稳定，暂时无法创建新的会话。</p>
        <p class="hint">请稍等片刻刷新页面，或联系管理员提升配额。</p>
    </div>
</body>
</html>
