[package]
name = "astrion-desktop"
version = "0.3.1"
description = "Astrion desktop shell (system WebView + embedded Python backend)"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
