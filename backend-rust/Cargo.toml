[package]
name = "astrion-headless"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
base64 = "0.22"
cap-fs-ext = "4"
cap-std = "4"
fs2 = "0.4"
futures-util = "0.3"
httpdate = "1"
html5ever = "0.38"
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo", "tzdb-concatenated", "tzdb-bundle-always"] }
ring = "0.17"
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
scrypt = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
serde_urlencoded = "0.7"
serde_yaml_ng = "0.10"
shlex = "2"
mime_guess = "2"
percent-encoding = "2"
tokio-util = { version = "0.7", features = ["io"] }
unsafe-libyaml = "0.2"
subtle = "2"
time = { version = "0.3", features = ["formatting", "parsing", "local-offset"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal", "process", "io-util"] }
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "astrion-headless"
path = "src/main.rs"

[[test]]
name = "responses_contract"
path = "../test/2026-11-24_Rust后端/responses_contract.rs"

[[test]]
name = "read_file_contract"
path = "../test/2026-11-24_Rust后端/read_file_contract.rs"

[[test]]
name = "storage_stats_contract"
path = "../test/2026-11-24_Rust后端/storage_stats_contract.rs"

[[test]]
name = "write_file_contract"
path = "../test/2026-11-24_Rust后端/write_file_contract.rs"
