<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>午夜植物园 · 海报匿名对比</title>
  <link rel="stylesheet" href="css/style.css">
  <script defer src="js/app.js"></script>
</head>
<body>
  <main class="comparison">
    <header class="heading">
      <div><h1>午夜植物园</h1><p>共同任务：我要设计一张“午夜植物园”主题的展览海报，给我 HTML。</p></div>
      <button id="reveal" type="button">揭示技能条件</button>
    </header>
    <nav class="toolbar" aria-label="对比设置">
      <span>两个独立中档实例</span>
      <div class="tabs" role="group" aria-label="查看宽度">
        <button type="button" data-size="desktop" aria-pressed="true">标准 720</button>
        <button type="button" data-size="mobile" aria-pressed="false">窄屏 390</button>
      </div>
    </nav>
    <div class="results" id="results" style="margin-top:20px"></div>
    <section class="feedback" aria-label="对比反馈">
      <div class="feedback-row"><span>你的偏好</span><div class="tabs" role="group" aria-label="选择更喜欢的作品">
        <button type="button" data-preference="A" aria-pressed="false">A 更好</button>
        <button type="button" data-preference="B" aria-pressed="false">B 更好</button>
        <button type="button" data-preference="tie" aria-pressed="false">差不多</button>
      </div></div>
      <label for="notes">感受或发现的问题</label>
      <textarea id="notes" rows="3"></textarea>
      <div class="feedback-row"><span id="save-status" role="status"></span><button id="export" type="button">导出反馈</button></div>
    </section>
    <footer>作品按相同比例缩放展示，也可单独查看。海报中的展览信息由各实例自行拟定。反馈不会自动发送到对话。</footer>
  </main>
</body>
</html>
