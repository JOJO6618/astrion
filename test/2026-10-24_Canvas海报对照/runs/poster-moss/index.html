<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>午夜植物园 · Midnight Botanica</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #050510;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Georgia', 'Times New Roman', serif;
    }

    .poster {
      position: relative;
      width: 620px;
      height: 877px;
      background: #050510;
      overflow: hidden;
    }

    /* === 背景层 === */
    .bg-gradient {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 40% at 50% 20%, #0a0a2e 0%, transparent 70%),
        radial-gradient(ellipse 80% 60% at 50% 100%, #0d0518 0%, transparent 70%),
        linear-gradient(180deg, #050510 0%, #080818 40%, #060512 100%);
    }

    /* 月光 */
    .moon {
      position: absolute;
      top: 40px;
      right: 60px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #e8e8ff, #aaaadd);
      box-shadow: 0 0 30px 10px rgba(180,180,255,0.15), 0 0 60px 20px rgba(150,150,220,0.08);
    }

    /* 星光 */
    .stars {
      position: absolute;
      inset: 0;
    }
    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: rgba(220,220,255,0.7);
    }
    .star:nth-child(odd) {
      animation: twinkle 3s ease-in-out infinite;
    }
    .star:nth-child(even) {
      animation: twinkle 4s ease-in-out infinite 1.5s;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    /* 地面渐变 */
    .ground {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 180px;
      background: linear-gradient(0deg, #020208 0%, transparent 100%);
    }

    /* === 植物剪影 SVG === */
    .plants-left {
      position: absolute;
      bottom: 0;
      left: -10px;
      width: 200px;
      height: 500px;
      opacity: 0.85;
    }
    .plants-right {
      position: absolute;
      bottom: 0;
      right: -10px;
      width: 200px;
      height: 500px;
      opacity: 0.85;
    }
    .plants-bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 700px;
      height: 200px;
      opacity: 0.6;
    }

    /* === 发光花朵 === */
    .flower {
      position: absolute;
      border-radius: 50%;
      filter: blur(1px);
    }
    .flower-1 {
      top: 140px;
      left: 45px;
      width: 8px;
      height: 8px;
      background: #00ffcc;
      box-shadow: 0 0 12px 4px rgba(0,255,204,0.5), 0 0 30px 10px rgba(0,255,204,0.2);
      animation: pulse 3s ease-in-out infinite;
    }
    .flower-2 {
      top: 200px;
      left: 120px;
      width: 6px;
      height: 6px;
      background: #cc66ff;
      box-shadow: 0 0 10px 3px rgba(204,102,255,0.5), 0 0 25px 8px rgba(204,102,255,0.2);
      animation: pulse 4s ease-in-out infinite 1s;
    }
    .flower-3 {
      top: 280px;
      left: 30px;
      width: 5px;
      height: 5px;
      background: #00ffaa;
      box-shadow: 0 0 8px 3px rgba(0,255,170,0.5);
      animation: pulse 3.5s ease-in-out infinite 0.5s;
    }
    .flower-4 {
      top: 160px;
      right: 50px;
      width: 7px;
      height: 7px;
      background: #9966ff;
      box-shadow: 0 0 11px 4px rgba(153,102,255,0.5), 0 0 28px 8px rgba(153,102,255,0.2);
      animation: pulse 3.8s ease-in-out infinite 1.5s;
    }
    .flower-5 {
      top: 230px;
      right: 110px;
      width: 5px;
      height: 5px;
      background: #00ffcc;
      box-shadow: 0 0 8px 3px rgba(0,255,204,0.5);
      animation: pulse 2.8s ease-in-out infinite 2s;
    }
    .flower-6 {
      top: 310px;
      right: 35px;
      width: 6px;
      height: 6px;
      background: #ff66cc;
      box-shadow: 0 0 10px 3px rgba(255,102,204,0.5);
      animation: pulse 4.2s ease-in-out infinite 0.8s;
    }
    .flower-7 {
      top: 380px;
      left: 80px;
      width: 4px;
      height: 4px;
      background: #66ccff;
      box-shadow: 0 0 7px 2px rgba(102,204,255,0.5);
      animation: pulse 3.2s ease-in-out infinite 1.2s;
    }
    .flower-8 {
      top: 360px;
      right: 85px;
      width: 5px;
      height: 5px;
      background: #aaffee;
      box-shadow: 0 0 8px 3px rgba(170,255,238,0.5);
      animation: pulse 3.6s ease-in-out infinite 0.3s;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.3); }
    }

    /* 萤火虫 */
    .firefly {
      position: absolute;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: rgba(200,255,180,0.9);
      box-shadow: 0 0 6px 2px rgba(200,255,180,0.4);
      animation: float var(--dur) ease-in-out infinite var(--delay);
    }
    @keyframes float {
      0%, 100% { transform: translate(0, 0); opacity: 0.2; }
      25% { transform: translate(var(--dx1), var(--dy1)); opacity: 0.9; }
      50% { transform: translate(var(--dx2), var(--dy2)); opacity: 0.4; }
      75% { transform: translate(var(--dx3), var(--dy3)); opacity: 0.8; }
    }

    /* === 主内容区 === */
    .content {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    /* 装饰分隔线 */
    .divider-top {
      width: 120px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #00ffcc, transparent);
      margin-bottom: 20px;
      opacity: 0.7;
    }

    /* 英文副标题 */
    .subtitle-en {
      font-family: 'Georgia', serif;
      font-size: 10px;
      letter-spacing: 0.5em;
      text-transform: uppercase;
      color: rgba(180,220,200,0.5);
      margin-bottom: 12px;
    }

    /* 中文主标题 */
    .title-zh {
      font-family: 'Georgia', 'Times New Roman', serif;
      font-size: 58px;
      font-weight: normal;
      color: transparent;
      background: linear-gradient(180deg, #e8e8ff 0%, #aaaadd 50%, #8888cc 100%);
      -webkit-background-clip: text;
      background-clip: text;
      line-height: 1.1;
      text-align: center;
      margin-bottom: 6px;
      text-shadow: none;
      letter-spacing: 0.1em;
    }

    /* 英文主标题 */
    .title-en {
      font-family: 'Georgia', serif;
      font-size: 13px;
      font-weight: normal;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: rgba(160,200,180,0.6);
      margin-bottom: 8px;
    }

    /* 装饰分隔线2 */
    .divider-mid {
      width: 200px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(0,255,204,0.3), #00ffcc, rgba(0,255,204,0.3), transparent);
      margin: 16px 0;
    }

    /* 描述文字 */
    .description {
      font-family: 'Georgia', serif;
      font-size: 11px;
      letter-spacing: 0.15em;
      color: rgba(200,200,220,0.45);
      text-align: center;
      line-height: 1.8;
      padding: 0 60px;
    }

    /* 装饰分隔线3 */
    .divider-bot {
      width: 80px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #9966ff, transparent);
      margin: 16px 0;
      opacity: 0.5;
    }

    /* 展览信息 */
    .info {
      font-family: 'Georgia', serif;
      font-size: 10px;
      letter-spacing: 0.2em;
      color: rgba(180,180,200,0.4);
      text-align: center;
      line-height: 2;
      text-transform: uppercase;
    }
    .info span {
      color: rgba(0,255,204,0.5);
    }

    /* 日期特别高亮 */
    .date {
      font-family: 'Georgia', serif;
      font-size: 12px;
      letter-spacing: 0.3em;
      color: rgba(200,200,255,0.6);
      margin-top: 8px;
    }
    .date span {
      color: rgba(153,102,255,0.8);
    }

    /* 底部装饰 */
    .bottom-deco {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .bottom-deco .dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: rgba(0,255,204,0.3);
    }
    .bottom-deco .dot:nth-child(2) {
      background: rgba(153,102,255,0.3);
    }
    .bottom-deco .dot:nth-child(3) {
      background: rgba(255,102,204,0.3);
    }

    /* 边缘光晕 */
    .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 90% 90% at 50% 50%, transparent 50%, rgba(5,5,16,0.7) 100%);
      pointer-events: none;
      z-index: 5;
    }

    /* 扫描线纹理（极淡） */
    .scanlines {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.03) 2px,
        rgba(0,0,0,0.03) 4px
      );
      pointer-events: none;
      z-index: 6;
    }
  </style>
</head>
