<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>第二轮 · 论文工作台匿名对比</title>
  <link rel="stylesheet" href="css/style.css">
  <script defer src="js/app.js"></script>
</head>
<body>
  <main class="comparison">
    <header class="heading">
      <div><h1>论文工作台 · 第二轮</h1><p>两个新建中档实例 · 同任务、同素材、各20分钟预算</p></div>
      <button id="reveal" type="button">揭示技能条件</button>
    </header>
    <nav class="toolbar" aria-label="对比设置">
      <p>先比较作品，再揭示分组。</p>
      <div class="tabs" role="group" aria-label="画布宽度">
        <button type="button" data-size="desktop" aria-pressed="true">桌面 1440</button>
        <button type="button" data-size="mobile" aria-pressed="false">窄屏 390</button>
      </div>
    </nav>
    <div class="results" id="results"></div>
    <section class="feedback" aria-label="对比反馈">
      <div class="feedback-row"><span>你的偏好</span><div class="tabs" role="group" aria-label="选择更喜欢的版本">
        <button type="button" data-preference="A" aria-pressed="false">A 更好</button>
        <button type="button" data-preference="B" aria-pressed="false">B 更好</button>
        <button type="button" data-preference="tie" aria-pressed="false">差不多</button>
      </div></div>
      <label for="notes">理由或发现的问题</label>
      <textarea id="notes" rows="3" placeholder="信息层级、阅读效率、交互或实际问题"></textarea>
      <div class="feedback-row"><span id="save-status" role="status"></span><button id="export" type="button">导出本轮反馈</button></div>
    </section>
    <footer>桌面作品按相同比例缩小展示；点击“单独查看”可直接操作。本轮每种条件只有一次生成。反馈需导出或直接告诉主对话。</footer>
  </main>
</body>
</html>
