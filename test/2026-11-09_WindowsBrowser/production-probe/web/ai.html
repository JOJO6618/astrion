<!doctype html><html><head><meta charset="utf-8"><title>Synthetic AI browser fixture</title><style>body{font:18px sans-serif;padding:24px}label,button,select{display:block;margin:14px 0}input,button,select{font:inherit}#source,#drop{display:inline-block;padding:24px;background:#ddd;margin:12px}.spacer{height:1300px}</style></head><body><h1>AI fixture</h1><label>Name <input aria-label="Name" id="name"></label><label>Password <input type="password" aria-label="Password" id="password"></label><label><input type="checkbox" aria-label="Subscribe" id="subscribe"> Subscribe</label><label>Level <input type="range" aria-label="Level" min="0" max="10" id="level"></label><label>Color <select aria-label="Color" id="color"><option value="red">Red</option><option value="blue">Blue</option></select></label><button id="counter" onclick="document.getElementById('status').textContent='Count: '+(++window.count)">Increment</button><p id="status" role="status">Count: 0</p><button id="upload" onclick="document.getElementById('file').click()">Upload fixture</button><input type="file" id="file" style="display:none" onchange="document.getElementById('file-state').textContent=this.files[0]?.name||'none'"><p id="file-state">No file</p><div id="source" draggable="true" role="button" aria-label="Drag source">Drag source</div><div id="drop" role="button" aria-label="Drop target" ondragover="event.preventDefault()" ondrop="event.preventDefault();this.textContent='Dropped: '+(event.dataTransfer.getData('text/plain')||event.dataTransfer.files[0]?.name||'drag')">Drop target</div><div class="spacer"></div><p>Bottom marker</p><script>window.count=0;document.getElementById('source').ondragstart=e=>e.dataTransfer.setData('text/plain','drag');</script></body></html>
