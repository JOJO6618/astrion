[package]
name = "astrion-browser-production-probe"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = { version = "=2.11.6", features = ["unstable", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
webview2-com = "=0.38.2"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
base64 = "0.22"
windows = { version = "=0.61.3", features = [
  "Foundation", "Graphics_Capture", "Graphics_DirectX_Direct3D11",
  "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm",
  "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture",
  "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_HiDpi", "Win32_System_Threading", "Win32_Storage_FileSystem",
  "Win32_System_Com", "Win32_Security_Cryptography", "Win32_UI_Shell",
  "Win32_System_DataExchange", "Win32_System_Memory"
] }
