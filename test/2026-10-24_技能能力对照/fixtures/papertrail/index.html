<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Papertrail 论文阅读工作台</title>
  <link rel="stylesheet" href="css/style.css">
  <script defer src="js/data.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body>
  <header><h1>Papertrail 论文阅读工作台</h1><span class="demo">演示数据 · 本地操作</span></header>
  <main>
    <aside><h2>我的研究</h2><p>全部论文</p><p>视觉与图形</p><p>人机交互</p><p>科研方法</p></aside>
    <section class="workspace">
      <div class="stats" id="stats"></div>
      <h2>管理你的论文，管理你的知识。</h2>
      <p class="intro">在这里检索论文、筛选阅读状态、查看详情并管理你的阅读进度。</p>
      <div class="tools">
        <input id="search" type="search" placeholder="搜索论文或作者">
        <div class="filters" aria-label="阅读状态">
          <button data-status="all" class="active">全部</button>
          <button data-status="unread">未读</button>
          <button data-status="reading">在读</button>
          <button data-status="read">已读</button>
        </div>
      </div>
      <div class="papers" id="papers"></div>
      <p id="empty" hidden>没有找到论文。</p>
    </section>
  </main>
  <div class="detail" id="detail" hidden><div id="detail-content"></div><button id="close-detail">关闭</button></div>
</body>
</html>
