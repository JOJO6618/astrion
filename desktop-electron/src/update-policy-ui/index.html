<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Astrion</title>
  <link rel="stylesheet" href="/update/required/style.css">
  <script src="/update/required/app.js" defer></script>
</head>
<body class="update-gate-page">
  <main class="update-gate" aria-busy="true">
    <div class="update-gate__brand">Astrion</div>
    <h1 id="heading"></h1>
    <p id="versions" class="update-gate__meta"></p>
    <p id="message"></p>
    <p id="reason" class="update-gate__reason"></p>
    <p id="cached" class="update-gate__meta" hidden></p>
    <p id="status" role="status" aria-live="polite"></p>
    <div id="activity" class="update-gate__activity" hidden><span></span></div>
    <div class="update-gate__actions">
      <button id="recheck" type="button"></button>
      <button id="exit" type="button"></button>
      <button id="download" class="update-gate__primary" type="button" hidden></button>
      <button id="install" class="update-gate__primary" type="button" hidden></button>
    </div>
  </main>
</body>
</html>
