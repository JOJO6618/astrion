# Astrion 桌面壳（Electron）打包配置。
# 产物：dmg（安装）+ zip（electron-updater mac 自动更新必需）+ latest-mac.yml（更新清单）。
# 发布链路：npm run build → 上传 dist/ 产物到服务器 downloads/ → 服务端 regen 清单。
appId: com.astrion.desktop
productName: Astrion
copyright: Copyright © 2026

# 注意：electron-builder 不会展开 extraMetadata 里的环境变量（会把 ${env.X} 原样写进包），
# build id 改由 scripts/run_builder.mjs 通过 -c.extraMetadata.astrionBuildId=<id> 注入。
# 0.10.4–0.10.9 的 macOS 包因此写入了字面量，服务端已兼容该字面量。
directories:
  output: dist
  buildResources: build

files:
  - src/**
  - package.json

# macOS 包从同一 staging 目录装入 Rust 后端、静态资源和公开配置。
extraResources:
  - from: ../static/src/locales/zh-CN/updatePolicy.json
    to: update-policy-locales/zh-CN.json
  - from: ../static/src/locales/en-US/updatePolicy.json
    to: update-policy-locales/en-US.json
  - from: .cache/rust-app/build/runtime
    to: runtime/rust
  - from: .cache/quick-entry-listener
    to: quick-entry-listener
  - from: .cache/quick-entry-capture
    to: quick-entry-capture

mac:
  category: public.app-category.productivity
  icon: ../desktop/src-tauri/icons/icon.icns
  # 签名身份：electron-updater 的 mac 更新验签走 codesign（不像 tauri 用 minisign），
  # 只接受有效（受信任）身份——Tauri 时代的自签名证书 "Astrion Local Sign"
  # （CSSMERR_TP_NOT_TRUSTED）会被 electron-builder 跳过导致包未签名、自动更新不可用。
  # 故改用钥匙串里的 Apple Development 证书（公证待办落地后再换 Developer ID）。
  identity: "Apple Development: 8613991190618 (LUX53G96H4)"
  target:
    - dmg
    - zip
  # 隐藏标题栏 + 红绿灯悬浮所需的窗口特性在主进程 window.js 配置，此处无需 entitlements

win:
  icon: ../desktop/src-tauri/icons/icon.ico
  target:
    - nsis

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

# electron-updater generic provider：清单 latest-mac.yml 由 electron-builder 构建时生成，
# 上传至 https://astrion.cyjai.com/downloads/ 目录（与 Tauri 清单并存，文件名不冲突）
publish:
  provider: generic
  url: https://astrion.cyjai.com/downloads/
